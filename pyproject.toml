[project]
name = "jack"
version = "0.1.0"
description = "Roadside assistance intake harness built on rig"
requires-python = ">=3.12,<4.0"
dependencies = ["rig[anthropic]"]

[project.scripts]
jack = "jack.cli:main"

[tool.poetry]
packages = [{ include = "jack", from = "src" }]

[tool.poetry.dependencies]
rig = { path = "../rig-py", develop = true, extras = ["anthropic"] }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"
ruff = "^0.6"
ty = "*"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ty.environment]
python-version = "3.12"
root = ["src", "tests", "tests/support"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["tests/support"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
